<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bibliothèque Numérique JC</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>Bibliothèque Numérique JC</h1>
    <nav aria-label="Navigation principale">
      <ul>
        <li><a href="#catalogue">Catalogue</a></li>
        <li><a href="#ajout">Ajouter un livre</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="catalogue" aria-labelledby="titre-catalogue">
     <h2 id="titre-catalogue">Catalogue</h2>
     <div id="liste-livres"></div>
    </section>

    <section id="ajout" aria-labelledby="titre-ajout">
           <h2 id="titre-ajout">Ajouter un livre</h2>
      <form id="formulaire-livre">
        <div>
          <label for="titre">Titre</label>
          <input type="text" id="titre" name="titre">
        </div>

        <div>
          <label for="auteur">Auteur</label>
          <input type="text" id="auteur" name="auteur">
        </div>
        <div>
          <label for="annee">Année</label>
          <input type="number" id="annee" name="annee">
        </div>
        <div>
          <label for="categorie">Catégorie</label>
          <select id="categorie" name="categorie">
            <option value="">Choisir une catégorie</option>
            <option value="roman">Roman</option>
            <option value="science">Science</option>
            <option value="histoire">Histoire</option>
            <option value="informatique">Informatique</option>
            <option value="autre">Autre</option>
          </select>
        </div>
        <div>
          <input type="checkbox" id="disponible" name="disponible">
          <label for="disponible">Disponible</label>
        </div>

        <button type="submit">Ajouter</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Bibliothèque Numérique JC</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
